name: CI

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-24.04
        env:
            CC: gcc-14
            CXX: g++-14
        steps:
            - uses: actions/checkout@v4
              with:
                  path: RAG
                  submodules: recursive
            - uses: actions/checkout@v4
              with:
                  repository: useplx/MyeLiN
                  path: MyeLiN
                  submodules: recursive
            - name: Install build tools
              run: sudo apt-get update && sudo apt-get install -y gcc-14 g++-14 ninja-build
            - name: Configure
              run: >-
                  cmake -S RAG -B build -G Ninja
                  -DCMAKE_BUILD_TYPE=Release
                  -DMLN_ROOT=${{ github.workspace }}/MyeLiN
            - name: Build
              run: cmake --build build --parallel 2
            - name: Test
              run: ctest --test-dir build --output-on-failure
